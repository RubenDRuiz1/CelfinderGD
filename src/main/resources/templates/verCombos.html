<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head-config :: head-config('CellFinder')}"></head>
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --accent-color: #f39c12;
    }
    body { background-color: #f8f9fa; font-family: 'Outfit', sans-serif; }
    .card { border-radius: 15px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); transition: transform 0.3s; }
    .header-section { background: var(--primary-gradient); color: white; padding: 40px 0; border-radius: 0 0 30px 30px; margin-bottom: 30px; }
    .btn-primary { background: var(--primary-gradient); border: none; border-radius: 10px; padding: 10px 25px; font-weight: 600; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
    .badge-promo { background-color: var(--accent-color); color: white; font-weight: bold; border-radius: 20px; padding: 5px 15px; }
    .product-list { max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 10px; padding: 10px; background: white; }
    .product-item { padding: 8px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
    .product-item:last-child { border-bottom: none; }
</style>
<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="header-section text-center">
        <h1 class="display-4 fw-bold">Gestión de Combos Promocionales</h1>
        <p class="lead">Crea paquetes de productos con un 15% de ahorro garantizado</p>
    </div>

    <div class="container mb-5">
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <i class="fas fa-check-circle me-2"></i> <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-4">
            <!-- Formulario de Creación -->
            <div class="col-lg-4">
                <div class="card p-4">
                    <h3 class="fw-bold mb-4"><i class="fas fa-plus-circle text-primary me-2"></i>Nuevo Combo</h3>
                    <form th:action="@{/admin/combos/crear}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre del Combo</label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej: Pack Gamer CelFinder" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Seleccionar Productos (Mínimo 2)</label>
                            <div class="product-list">
                                <div th:each="p : ${productos}" class="product-item">
                                    <input class="form-check-input me-2" type="checkbox" name="productoIds" th:value="${p.id}" th:id="'p-' + ${p.id}">
                                    <label class="form-check-label small" th:for="'p-' + ${p.id}">
                                        <span th:text="${p.nombre}"></span> - 
                                        <strong th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></strong>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-magic me-2"></i>Generar Combo (Ahorro 15%)
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Listado de Combos Existentes -->
            <div class="col-lg-8">
                <div class="card p-4 h-100">
                    <h3 class="fw-bold mb-4"><i class="fas fa-list text-primary me-2"></i>Combos Activos</h3>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Combo</th>
                                    <th>Precio Original</th>
                                    <th>Precio Final</th>
                                    <th>Ahorro</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${combos}">
                                    <td>
                                        <div class="fw-bold text-dark" th:text="${c.nombre}"></div>
                                        <small class="text-muted" th:text="${#lists.size(c.productoIds)} + ' productos'"></small>
                                    </td>
                                    <td><del class="text-muted" th:text="'$' + ${#numbers.formatDecimal(c.precioOriginal, 1, 2)}"></del></td>
                                    <td><span class="text-success fw-bold" th:text="'$' + ${#numbers.formatDecimal(c.precioCombo, 1, 2)}"></span></td>
                                    <td><span class="badge-promo">15% OFF</span></td>
                                    <td>
                                        <form th:action="@{/admin/combos/eliminar/{id}(id=${c.id})}" method="post">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Seguro que deseas eliminar este combo?')">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(combos)}">
                                    <td colspan="5" class="text-center text-muted py-4">No hay combos promocionales creados.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mt-4">
        <div class="col-12">
            <div class="card p-4">
                <h3 class="fw-bold mb-4"><i class="fas fa-percent text-success me-2"></i>Descuentos Individuales</h3>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Producto</th>
                                <th>Precio Base</th>
                                <th>Descuento</th>
                                <th>Precio Final</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${productos}">
                                <td th:text="${p.nombre}"></td>
                                <td th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                                <td>
                                    <form th:action="@{/ventas/editar/{id}(id=${p.id})}" method="post" class="d-flex align-items-center">
                                        <input type="hidden" name="nombre" th:value="${p.nombre}">
                                        <input type="hidden" name="precio" th:value="${p.precio}">
                                        <input type="hidden" name="categoria" th:value="${p.categoria}">
                                        <input type="hidden" name="marca" th:value="${p.marca}">
                                        <input type="hidden" name="estadoVenta" th:value="${p.estadoVenta}">
                                        <input type="number" name="descuento" th:value="${p.descuento}" class="form-control form-control-sm w-50 me-2" min="0" max="100">
                                        <button type="submit" class="btn btn-sm btn-success">Actualizar</button>
                                    </form>
                                </td>
                                <td class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(p.getPrecioFinal(), 1, 2)}"></td>
                                <td>
                                    <a th:href="@{/ventas/detalle/{id}(id=${p.id})}" class="btn btn-sm btn-link">Ver</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments/chat :: floating-chat}"></div>
</body>
</html>
