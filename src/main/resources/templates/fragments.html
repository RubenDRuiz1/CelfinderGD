<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | CellFinder'"></title>
    <link rel="icon" href="https://github.com/Rukxxxx/ctm/blob/main/celfinder%20logo.png?raw=true" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Ocultar globalmente el chat antiguo para evitar duplicidad y errores */
        #chat-button, #chat-modal, #chat-overlay { display: none !important; }
    </style>
</head>

<body>
    <!-- Fragmento del Header principal -->
    <header th:fragment="header">
        <div class="logo-container">
            <img src="https://github.com/Rukxxxx/ctm/blob/main/celfinder%20logo%20nombre.png?raw=true" alt="Logo CellFinder" class="logo" onclick="location.href='/menu'" style="cursor: pointer;">
        </div>

        <nav class="menu-container">
            <ul class="menu">
                <li>
                    <a href="/ventas/carrito/ver" class="position-relative me-3">
                        <i class="fas fa-shopping-cart" style="color: white; font-size: 1.2rem;"></i>
                        <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                              th:text="${carritoContador}" th:if="${carritoContador != null && carritoContador > 0}">0</span>
                    </a>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <a href="/ventas/notificaciones" class="position-relative me-3" id="notif-link">
                        <i class="fas fa-bell" style="color: white; font-size: 1.2rem;"></i>
                        <span id="notif-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">0</span>
                    </a>
                </li>
                <li><a href="/ventas/listar">Mercado</a></li>
                <li sec:authorize="hasRole('VENDEDOR') or hasRole('ADMIN')">
                    <a href="/admin/combos/ver" style="background-color: #f39c12; color: white; font-weight: bold;">
                        <i class="fas fa-tags me-1"></i> Gestionar Ofertas
                    </a>
                </li>
                <!-- Panel Admin (Solo si aplica) -->
                <li sec:authorize="hasRole('ADMIN')">
                    <a href="/admin" style="background-color: #e74c3c; color: white;">Panel Admin</a>
                </li>
                
                <!-- Menú Usuario NO Autenticado -->
                <li sec:authorize="!isAuthenticated()" style="display: flex; align-items: center; gap: 10px;">
                    <a href="/usuarios/login" class="btn btn-outline-light btn-sm" style="color: white; border-color: white;">Iniciar Sesión</a>
                    <a href="/usuarios/registro" class="btn btn-primary btn-sm">Registrarse</a>
                </li>

                <!-- Menú de Usuario -->
                <li class="user-menu" sec:authorize="isAuthenticated()">
                    <button id="username-btn" class="user-btn">
                        <img id="profile-img" th:src="${#authentication.principal.imagenPerfil != null ? 'data:image/jpeg;base64,' + #authentication.principal.imagenPerfil : 'https://via.placeholder.com/30'}" alt="Perfil">
                        <span id="header-username" th:text="${#authentication.principal.nombreUsuario}">Cargando...</span>
                    </button>
                    <div class="user-dropdown" id="user-dropdown">
                        <button onclick="location.href='/usuarios/perfil'" class="dropdown-item-btn">Ver Perfil</button>
                        <button onclick="location.href='/usuarios/editar-perfil'" class="dropdown-item-btn">Ajustes de Perfil</button>
                        <button onclick="location.href='/ventas/notificaciones'" class="dropdown-item-btn">Notificaciones</button>
                        <form th:action="@{/logout}" method="post" style="margin: 0; padding: 0;">
                            <button type="submit" class="logout-btn" style="width: 100%; text-align: left; background: none; border: none; padding: 10px 15px; color: inherit; cursor: pointer;">Cerrar Sesión</button>
                        </form>
                    </div>
                </li>
            </ul>
        </nav>

        <style>
            /* Clean styles for dropdown buttons */
            .dropdown-item-btn, .logout-btn {
                background: none; border: none; width: 100%; text-align: left; padding: 10px 15px; cursor: pointer; color: #333; transition: background 0.2s;
            }
            .dropdown-item-btn:hover, .logout-btn:hover { background-color: #f8f9fa; }
        </style>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const btn = document.getElementById('username-btn');
                const drop = document.getElementById('user-dropdown');
                if (btn && drop) {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        drop.classList.toggle('visible');
                    });
                    document.addEventListener('click', () => drop.classList.remove('visible'));
                }

                // --- SISTEMA DE NOTIFICACIONES DINÁMICAS (UX) ---
                const notifBadge = document.getElementById('notif-badge');
                if (notifBadge) {
                    let lastCount = 0;
                    const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'); // Sound fallback

                    function checkNotifications() {
                        fetch('/api/notificaciones/conteo-no-leidas')
                            .then(r => r.ok ? r.json() : {success: false})
                            .then(data => {
                                if (data.success) {
                                    const count = data.conteo;
                                    if (count > 0) {
                                        notifBadge.textContent = count;
                                        notifBadge.style.display = 'inline-block';
                                        if (count > lastCount) {
                                            audio.play().catch(e => console.log("Audio play blocked: " + e));
                                        }
                                    } else {
                                        notifBadge.style.display = 'none';
                                    }
                                    lastCount = count;
                                }
                            })
                            .catch(err => console.error("Error polling notifications:", err));
                    }

                    checkNotifications();
                    setInterval(checkNotifications, 10000);
                }
            });
        </script>
    </header>

    <!-- Fragmento del Footer -->
    <footer th:fragment="footer">
        <div class="footer-content">
            <p>© 2025 CellFinder TechMatch</p>
            <p>Integrantes: Edder Espitia y Ruben Ruiz</p>
        </div>
        
        <!-- Integración del Asistente de IA (Persistente) -->
        <div th:replace="~{fragments/chat-component :: chat}"></div>
    </footer>
</body>
</html>
