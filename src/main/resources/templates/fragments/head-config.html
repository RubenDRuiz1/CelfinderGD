<head th:fragment="head-config(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | CellFinder'"></title>
    <link rel="icon" href="https://github.com/Rukxxxx/ctm/blob/main/celfinder%20logo.png?raw=true" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    
    <!-- Global CSS for uniform aesthetics -->
    <style>
        :root {
            --header-bg: #2c3e50;
            --header-text: white;
            --body-bg: #f8f9fa;
            --primary-btn-bg: #3498db;
            --primary-btn-hover-bg: #2980b9;
        }
        body {
            background-color: var(--body-bg, #f8f9fa);
            font-family: 'Inter', 'Roboto', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
    </style>
</head>
