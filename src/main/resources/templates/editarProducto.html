<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head-config :: head-config('Editar Producto')}"></head>
<style>
    body { background-color: #f4f6f9; font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
    .main-container { max-width: 900px; margin: 40px auto; }
    .form-card { background: #fff; border-radius: 16px; padding: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .section-title { font-weight: 800; color: #2c3e50; margin-bottom: 25px; position: relative; padding-bottom: 10px; border-bottom: 2px solid #f0f2f5; }
    .section-title::after { content: ''; position: absolute; left: 0; bottom: -2px; height: 2px; width: 50px; background: #3498db; }
    
    .form-label { font-weight: 600; color: #495057; font-size: 0.9rem; }
    .form-control, .form-select { border-radius: 8px; border: 1px solid #ced4da; padding: 12px 15px; font-size: 0.95rem; background-color: #f8f9fa; transition: all 0.3s; }
    .form-control:focus, .form-select:focus { background-color: #fff; border-color: #3498db; box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25); }
    
    .file-upload-wrapper { position: relative; width: 100%; height: 150px; border: 2px dashed #ced4da; border-radius: 12px; background: #f8f9fa; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s; cursor: pointer; }
    .file-upload-wrapper:hover { border-color: #3498db; background: #f1f5f9; }
    .file-upload-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    
    .current-img-preview { width: 150px; height: 150px; object-fit: contain; border-radius: 8px; border: 1px solid #dee2e6; padding: 5px; background: #fff; }
    
    .btn-save { background: #198754; border: none; font-weight: 700; font-size: 1.1rem; padding: 15px; border-radius: 8px; transition: all 0.3s; color: white; width: 100%; margin-top: 20px; }
    .btn-save:hover { background: #157347; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(25,135,84,0.3); color: white; }
</style>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container main-container flex-grow-1">
    <div th:if="${error}" class="alert alert-danger shadow-sm rounded-3" th:text="${error}"></div>
    <div th:if="${mensaje}" class="alert alert-success shadow-sm rounded-3" th:text="${mensaje}"></div>

    <div class="form-card">
        <div class="text-center mb-5">
            <h2 class="fw-bolder text-dark">Editar Producto</h2>
            <p class="text-muted">Actualiza los detalles o el stock de tu inventario</p>
        </div>

        <form th:action="@{'/ventas/editar/' + ${producto.id}}" method="post" th:object="${producto}" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <!-- SECCIÓN BÁSICA -->
            <h4 class="section-title"><i class="fas fa-edit text-primary me-2"></i>Información General</h4>
            
            <div class="row g-4 mb-4">
                <div class="col-md-12">
                    <label class="form-label">Nombre del Producto <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>
                
                <div class="col-md-6">
                    <label class="form-label">Marca <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{marca}" required>
                </div>
                
                <div class="col-md-6">
                    <label class="form-label">Categoría <small class="text-muted">(No editable)</small></label>
                    <input type="text" class="form-control bg-light" th:field="*{categoria}" readonly>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Precio ($ COP) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" th:field="*{precio}" min="30000" step="1" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Stock <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" th:field="*{stock}" min="0" step="1" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Descuento (%) <small class="text-muted">(Opcional)</small></label>
                    <input type="number" class="form-control" th:field="*{descuento}" min="0" max="100">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Estado de Venta <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{estadoVenta}" required>
                        <option value="DISPONIBLE">Disponible</option>
                        <option value="AGOTADO">Agotado</option>
                        <option value="RESERVADO">Reservado</option>
                        <option value="PAUSADO">Pausado</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label">Descripción Detallada</label>
                    <textarea class="form-control" th:field="*{descripcion}" rows="4"></textarea>
                </div>
            </div>

            <!-- SECCIÓN IMÁGENES -->
            <h4 class="section-title mt-5"><i class="fas fa-camera text-primary me-2"></i>Actualizar Imagen</h4>
            <div class="row align-items-center mb-4">
                <div class="col-md-4 text-center">
                    <label class="form-label d-block text-start">Imagen Actual</label>
                    <img th:if="${producto.imagenBase64 != null and !producto.imagenBase64.isEmpty()}" 
                         th:src="@{'data:image/jpeg;base64,' + ${producto.imagenBase64}}" 
                         class="current-img-preview">
                    <div th:unless="${producto.imagenBase64 != null and !producto.imagenBase64.isEmpty()}" 
                         class="current-img-preview d-flex align-items-center justify-content-center bg-light">
                        <i class="fas fa-image fa-3x text-muted"></i>
                    </div>
                </div>
                <div class="col-md-8">
                    <label class="form-label">Subir nueva imagen <small class="text-muted">(Opcional)</small></label>
                    <div class="file-upload-wrapper">
                        <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-2"></i>
                        <span class="fw-bold text-muted" id="file-name-text">Haz clic o arrastra para reemplazar la imagen</span>
                        <input type="file" class="file-upload-input" id="imagen" name="imagen" accept="image/*" onchange="updateFileName(this)">
                    </div>
                </div>
            </div>

            <div class="d-flex gap-3 mt-5">
                <a href="/mi-inventario" class="btn btn-outline-secondary fw-bold rounded-3 px-4 py-3 w-50">Cancelar</a>
                <button type="submit" class="btn btn-save w-50 m-0">
                    <i class="fas fa-save me-2"></i>Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</main>

<footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
        <p class="mb-1 fw-bold fs-5">CellFinder TechMatch © 2025</p>
        <p class="text-white-50 mb-0 small">Universidad Cedesarrollo, Cartagena Bolívar | edderespitia@gmail.com | +57 3126409354</p>
    </div>
</footer>

<div th:replace="~{fragments/chat :: floating-chat}"></div>

<script>
    function updateFileName(input) {
        const textElement = document.getElementById('file-name-text');
        if (input.files && input.files[0]) {
            textElement.textContent = input.files[0].name;
            textElement.classList.add('text-success');
        } else {
            textElement.textContent = 'Haz clic o arrastra para reemplazar la imagen';
            textElement.classList.remove('text-success');
        }
    }
</script>
</body>
</html>
