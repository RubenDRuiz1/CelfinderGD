<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head-config :: head-config('Solicitar Compra')}"></head>
<style>
    body { background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); min-height: 100vh; display: flex; flex-direction: column; }
    .card { max-width: 700px; margin: 40px auto; border-radius: 25px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
    .producto-img { height: 280px; object-fit: cover; width: 100%; }
    .precio { font-size: 3rem; color: #e74c3c; font-weight: bold; }
    .btn-enviar { background: #28a745; border: none; padding: 16px; font-size: 1.3rem; border-radius: 50px; transition: all 0.3s; }
    .btn-enviar:hover { background: #218838; transform: scale(1.03); }
</style>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-5 flex-grow-1 d-flex align-items-center">
    <div class="card w-100">
        <img th:if="${producto.imagenBase64 != null and producto.imagenBase64 != ''}"
             th:src="@{'data:image/jpeg;base64,' + ${producto.imagenBase64}}"
             class="producto-img" alt="Producto">
        <div th:unless="${producto.imagenBase64 != null and producto.imagenBase64 != ''}"
             style="height:200px; background:#dee2e6; display:flex; align-items:center; justify-content:center;">
            <i class="fas fa-mobile-alt fa-4x text-muted"></i>
        </div>

        <div class="card-body text-center p-5 bg-white">
            <h2 class="mb-3 fw-bold" th:text="${producto.nombre}"></h2>
            <p class="text-muted mb-2" th:text="${producto.descripcion}"></p>
            <div class="precio mb-4">$ <span th:text="${producto.precio}"></span></div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/ventas/procesar-compra}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="productoId" th:value="${producto.id}">

                <div class="mb-4">
                    <label class="form-label text-muted">Dirección de envío</label>
                    <input type="text" name="direccion" class="form-control form-control-lg text-center" required
                           placeholder="Dirección completa de envío"
                           th:value="${comprador.ciudad != null ? comprador.ciudad + ', ' + comprador.departamento : ''}">
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Correo de contacto</label>
                    <input type="email" name="correo" class="form-control form-control-lg text-center" required
                           th:value="${comprador.email}">
                </div>
                <div class="mb-5">
                    <label class="form-label text-muted">Teléfono de contacto</label>
                    <input type="text" name="contacto" class="form-control form-control-lg text-center" required
                           pattern="\d{10}" maxlength="10"
                           placeholder="Teléfono (10 dígitos)"
                           th:value="${comprador.telefono}">
                </div>

                <button type="submit" class="btn btn-enviar text-white w-100">
                    <i class="fas fa-paper-plane me-2"></i>ENVIAR SOLICITUD DE COMPRA
                </button>
            </form>

            <a th:href="@{/ventas/detalle/{id}(id=${producto.id})}" class="btn btn-link mt-4 text-muted">
                <i class="fas fa-arrow-left me-1"></i>Cancelar
            </a>
        </div>
    </div>
</main>

<footer style="text-align:center; padding:20px; background:#2c3e50; color:white; margin-top:auto;">
    <div>
        <p>© 2025 CellFinder TechMatch</p>
        <p>Dirección: la universidad cedesarrollo, Cartagena bolivar</p>
        <p>Teléfono: +57 3126409354 | Email: edderespitia@gmail.com</p>
        <p>Integrantes: Edder Espitia y Ruben Ruiz</p>
    </div>
</footer>

<div th:replace="~{fragments/chat :: floating-chat}"></div>

</body>
</html>
