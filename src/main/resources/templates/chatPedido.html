<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head-config :: head-config('Chat de Pedido')}"></head>
<style>
    .chat-container {
        display: flex;
        flex-direction: column;
        height: 500px;
        border: 1px solid #dee2e6;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #f8f9fa;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .message-bubble {
        max-width: 70%;
        padding: 10px 15px;
        border-radius: 18px;
        font-size: 14px;
        line-height: 1.5;
        word-break: break-word;
    }
    .message-mine {
        align-self: flex-end;
        background: #3498db;
        color: white;
        border-bottom-right-radius: 4px;
    }
    .message-other {
        align-self: flex-start;
        background: white;
        color: #2c3e50;
        border: 1px solid #dee2e6;
        border-bottom-left-radius: 4px;
    }
    .message-meta {
        font-size: 11px;
        opacity: 0.7;
        margin-top: 3px;
    }
    .chat-input-bar {
        padding: 15px;
        background: white;
        border-top: 1px solid #dee2e6;
        display: flex;
        gap: 10px;
    }
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
    }
    .status-PENDIENTE   { background:#e2e8f0; color:#475569; }
    .status-PREPARANDO  { background:#fef3c7; color:#92400e; }
    .status-ENVIADO     { background:#dbeafe; color:#1e40af; }
    .status-ENTREGADO   { background:#d1fae5; color:#065f46; }
</style>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container" style="max-width:800px; margin:30px auto; padding:20px; flex:1;">

    <!-- Encabezado del pedido -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold mb-1">
                        <i class="fas fa-comments me-2 text-primary"></i>Chat del Pedido
                    </h2>
                    <p class="text-muted mb-1">
                        <strong>Producto:</strong>
                        <span th:text="${solicitud.nombreProducto ?: 'Producto'}"></span>
                    </p>
                    <p class="text-muted mb-0">
                        <strong>Pedido ID:</strong> <code th:text="${solicitud.id}"></code>
                    </p>
                </div>
                <div class="text-end">
                    <div th:if="${solicitud.estadoSeguimiento != null}">
                        <span class="status-badge"
                              th:classappend="'status-' + ${solicitud.estadoSeguimiento}"
                              th:text="${solicitud.estadoSeguimiento}">PENDIENTE</span>
                    </div>
                    <a th:href="@{/ventas/rastreo-pedido/{id}(id=${solicitud.id})}"
                       class="btn btn-sm btn-outline-primary mt-2">
                        <i class="fas fa-map-marker-alt me-1"></i>Ver Rastreo
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Ventana de chat -->
    <div class="chat-container mb-4">
        <div class="chat-messages" id="chat-messages">
            <div th:if="${chat.mensajes == null or chat.mensajes.isEmpty()}" class="text-center text-muted py-4">
                <i class="fas fa-comment-slash fa-2x mb-2"></i>
                <p>No hay mensajes aún. ¡Inicia la conversación!</p>
            </div>

            <div th:each="msg : ${chat.mensajes}">
                <!-- Mensaje mío -->
                <div th:if="${msg.remitenteId == usuarioActual.id}" class="d-flex flex-column align-items-end">
                    <div class="message-bubble message-mine" th:text="${msg.contenido}"></div>
                    <div class="message-meta text-end">
                        <span th:text="${msg.fecha != null ? #temporals.format(msg.fecha, 'dd/MM HH:mm') : ''}"></span>
                    </div>
                </div>
                <!-- Mensaje del otro -->
                <div th:unless="${msg.remitenteId == usuarioActual.id}" class="d-flex flex-column align-items-start">
                    <div class="message-bubble message-other" th:text="${msg.contenido}"></div>
                    <div class="message-meta">
                        <span th:text="${msg.fecha != null ? #temporals.format(msg.fecha, 'dd/MM HH:mm') : ''}"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input -->
        <form th:action="@{/ventas/chat-pedido/{chatId}/enviar(chatId=${chat.id})}" method="post" class="chat-input-bar">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="solicitudId" th:value="${solicitud.id}">
            <input type="text" name="contenido" id="msg-input" class="form-control"
                   placeholder="Escribe un mensaje..." autocomplete="off" required
                   style="border-radius:20px;">
            <button type="submit" class="btn btn-primary" style="border-radius:20px; padding: 8px 20px;">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- Acciones -->
    <div class="d-flex gap-2 justify-content-center">
        <a th:href="@{/ventas/historial-compras}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Mis Compras
        </a>
        <a th:href="@{/ventas/historial-ventas}" class="btn btn-outline-secondary">
            <i class="fas fa-chart-line me-2"></i>Mis Ventas
        </a>
    </div>
</main>

<footer style="text-align:center; padding:20px; background:#2c3e50; color:white; margin-top:auto;">
    <div>
        <p>© 2025 CellFinder TechMatch | Dirección: la universidad cedesarrollo, Cartagena bolivar</p>
    </div>
</footer>

<div th:replace="~{fragments/chat :: floating-chat}"></div>

<script>
    // Auto-scroll al fondo del chat
    const msgs = document.getElementById('chat-messages');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
</script>

</body>
</html>
