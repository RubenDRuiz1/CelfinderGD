spring.application.name=Celfinder

server.port=8080
spring.main.web-application-type=servlet
llm.provider=deepseek


spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.max-age=3600

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Base de datos en la nube (MongoDB Atlas) principal
spring.data.mongodb.uri=mongodb+srv://ruizredon:Pelota22@celfinder.tt2zuht.mongodb.net/celfinder?retryWrites=true&w=majority&appName=celfinder

# Base de datos local para uso futuro
# spring.data.mongodb.uri=mongodb://localhost:27017/celfinder

ollama.base-url=http://localhost:11434
ollama.model=llama3.2:1b

# Configuración de OpenRouter
openrouter.api.key=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
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=meta-llama/llama-3.3-70b-instruct

# Configuración de DeepSeek
deepseek.api.key=${DEEPSEEK_API_KEY:sk-d6d91219784e4e06b17a0999bf5baa68}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat

server.error.include-message=always
server.error.include-binding-errors=always

logging.level.org.springframework.security=DEBUG
logging.level.com.celfinder=DEBUG
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Configuración de subida de archivos (Fix para imágenes grandes)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Duración de la sesión (4 horas)
server.servlet.session.timeout=4h

# ============================================================
# MÓDULO MCP (Model Context Protocol) - MongoDB
# Nuevo módulo agregado - NO modifica servicios existentes
# Endpoints: /mcp/tools, /mcp/execute, /mcp/health
# ============================================================
mcp.enabled=true
mcp.max-results=100
